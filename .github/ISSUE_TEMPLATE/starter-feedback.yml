name: VDAI AI Starter feedback
description: Report one reproducible problem or suggestion after installation.
title: "[feedback]: "
labels: ["feedback"]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Codex, Claude Code]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Starter version
      placeholder: "5"
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Conversation language
      options: [English, Russian, Spanish, Polish, Other]
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Do not include secrets, private chats, client data, or sensitive screenshots.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Safe reproduction steps
      description: Provide the shortest sequence and the relevant PASS/FAIL row.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-data check
      options:
        - label: I removed secrets, credentials, private prompts, private chats, client data, and local absolute paths.
          required: true
